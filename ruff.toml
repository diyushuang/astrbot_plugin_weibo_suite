exclude = ["_tools", ".venv", "dist", "build"]
line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["BLE001", "RUF001", "RUF002", "RUF003"]

[format]
quote-style = "double"
indent-style = "space"

[lint.isort]
# 仓库根就是插件根，astrbot_plugin_weibo_suite 目录已不存在；不显式声明的话
# ruff 会把它当第三方包，把 try/except 里的兜底导入重新排序（纯噪音 diff）。
known-first-party = ["astrbot_plugin_weibo_suite"]

[lint.per-file-ignores]
"weibo/*.py" = ["F403", "F405"]
"weibo/runtime.py" = ["F401", "RUF100"]
