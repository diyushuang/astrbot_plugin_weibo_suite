version: 2

updates:
  # 运行期依赖（requirements.txt）——只在直接依赖有安全修复时才值得跟进，
  # 这里统一按周聚合成一个 PR，避免逐个包开 PR 刷屏。
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
      include: scope
    labels:
      - dependencies
    groups:
      runtime:
        patterns:
          - "aiohttp"
          - "Pillow"
          - "numpy"
          - "pillow-heif"

  # 门禁用的 GitHub Actions：升级在 PR 里就能看到 CI 结果，风险最低。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - ci
