name: 功能建议
description: 希望插件支持新的平台、新的推送方式或新的管理能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提需求前建议先看 [docs/COMMANDS.md](../blob/main/docs/COMMANDS.md) 与
        [docs/CONFIGURATION.md](../blob/main/docs/CONFIGURATION.md)，
        不少能力已经存在但藏在配置或子命令里。
  - type: dropdown
    id: domain
    attributes:
      label: 属于哪个域
      options:
        - 微博监控转发
        - 群相册
        - 归档与回填
        - 图床与向量管线
        - 文案库（签到文案）
        - 图片溯源与签到
        - 多平台订阅（抖音 / 小红书 / IG）
        - 管理面板
        - 其它
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述场景与痛点，不要直接跳到方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
    validations:
      required: false
  - type: dropdown
    id: risk
    attributes:
      label: 该功能是否涉及平台风控或账号安全
      options:
        - 不涉及（纯本地或纯展示）
        - 涉及，但可以做到很低频
        - 涉及，且无法回避高频请求
        - 不确定
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue，没有重复
          required: true
        - label: 我理解新增的取数通道必须服从「保号优先」的既有设计
          required: true
